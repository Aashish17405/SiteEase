<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteEase</title>
  <link rel="stylesheet" href="index.css" />
  <style>
    /* ── Popup shell ─────────────────────────────────── */
    body {
      min-height: auto;
      padding: 14px;
      background: #0f172a;
    }

    /* ── Header ──────────────────────────────────────── */
    .se-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .se-header img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }

    .se-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: -0.3px;
    }

    .se-header h1 span {
      color: #22c55e;
    }

    .se-badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      background: #14532d;
      color: #4ade80;
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 0.04em;
    }

    /* ── Toggle rows (existing color toggles) ─────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 6px;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .toggle-row:hover {
      background: #243347;
      border-color: #475569;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
    }

    /* Hidden checkbox trick */
    .toggle-row input[type="checkbox"] {
      display: none;
    }

    /* The pill switch */
    .pill {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: #334155;
      position: relative;
      cursor: pointer;
      transition: background 0.25s;
      flex-shrink: 0;
    }

    .pill::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #94a3b8;
      top: 3px;
      left: 3px;
      transition: transform 0.25s, background 0.25s;
    }

    /* Checked state colours per condition */
    #protanopia:checked   ~ .pill { background: #2563eb; }
    #deuteranopia:checked ~ .pill { background: #d97706; }
    #blue-blindness:checked  ~ .pill { background: #dc2626; }
    #yellow-blindness:checked ~ .pill { background: #7c3aed; }
    #achromatopsia:checked ~ .pill { background: #475569; }
    #dyslexia:checked     ~ .pill { background: #16a34a; }

    input[type="checkbox"]:checked ~ .pill::after {
      transform: translateX(20px);
      background: #fff;
    }

    /* ── GitHub link row ──────────────────────────────── */
    .github-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 6px;
    }

    .github-row span {
      font-size: 12px;
      color: #64748b;
    }

    .github-row a {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 4px 8px;
      transition: background 0.15s, border-color 0.15s;
    }

    .github-row a:hover {
      background: #334155;
      border-color: #64748b;
    }

    .github-row img {
      width: 18px;
      height: 18px;
      filter: invert(1) brightness(0.75);
    }
  </style>
</head>

<body>

  <!-- ── HEADER ─────────────────────────────────────── -->
  <div class="se-header">
    <img src="icons/icon-48x48.png" alt="SiteEase logo" />
    <h1>Site<span>Ease</span></h1>
    <div class="se-badge">v1.3</div>
  </div>

  <!-- ══════════════════════════════════════════════════
       SECTION 1 — VISION FILTERS
  ═══════════════════════════════════════════════════ -->
  <div class="section-label">Vision Filters</div>

  <!-- Protanopia -->
  <label class="toggle-row" for="protanopia">
    <input type="checkbox" id="protanopia" />
    <span class="toggle-label">🔴 Red Blindness (Protanopia)</span>
    <div class="pill"></div>
  </label>

  <!-- Deuteranopia -->
  <label class="toggle-row" for="deuteranopia">
    <input type="checkbox" id="deuteranopia" />
    <span class="toggle-label">🟢 Green Blindness (Deuteranopia)</span>
    <div class="pill"></div>
  </label>

  <!-- Tritanopia -->
  <label class="toggle-row" for="blue-blindness">
    <input type="checkbox" id="blue-blindness" />
    <span class="toggle-label">🔵 Blue Blindness (Tritanopia)</span>
    <div class="pill"></div>
  </label>

  <!-- Tritanomaly -->
  <label class="toggle-row" for="yellow-blindness">
    <input type="checkbox" id="yellow-blindness" />
    <span class="toggle-label">🟡 Yellow Blindness (Tritanomaly)</span>
    <div class="pill"></div>
  </label>

  <!-- Achromatopsia -->
  <label class="toggle-row" for="achromatopsia">
    <input type="checkbox" id="achromatopsia" />
    <span class="toggle-label">⬛ Achromatopsia</span>
    <div class="pill"></div>
  </label>

  <!-- Dyslexia -->
  <label class="toggle-row" for="dyslexia">
    <input type="checkbox" id="dyslexia" />
    <span class="toggle-label">📖 Dyslexia (OpenDyslexic Font)</span>
    <div class="pill"></div>
  </label>

  <!-- ══════════════════════════════════════════════════
       SECTION 2 — FONT SIZE
  ═══════════════════════════════════════════════════ -->
  <div class="section-label">Font Size</div>

  <div class="feature-row">
    <span class="feature-row-label">🔤 Text Size</span>
    <div class="stepper">
      <button class="stepper-btn" id="font-dec" title="Decrease font size">−</button>
      <span class="stepper-value" id="font-size-display">16px</span>
      <button class="stepper-btn" id="font-inc" title="Increase font size">+</button>
      <button class="btn-reset" id="font-reset" title="Reset to default">Reset</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════
       SECTION 3 — PAGE MAGNIFIER
  ═══════════════════════════════════════════════════ -->
  <div class="section-label">Page Magnifier</div>

  <div class="feature-row">
    <span class="feature-row-label">🔍 Zoom Level</span>
    <div class="stepper">
      <button class="stepper-btn" id="zoom-dec" title="Zoom out">−</button>
      <span class="stepper-value" id="zoom-display">100%</span>
      <button class="stepper-btn" id="zoom-inc" title="Zoom in">+</button>
      <button class="btn-reset" id="zoom-reset" title="Reset zoom">Reset</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════
       SECTION 4 — IMAGE REMOVER
  ═══════════════════════════════════════════════════ -->
  <div class="section-label">Images</div>

  <div class="feature-row">
    <span class="feature-row-label">🖼️ Page Images</span>
    <div style="display:flex;align-items:center;gap:6px;">
      <span class="img-status" id="img-status">Visible</span>
      <button class="btn-img-toggle hide" id="btn-hide-images">Hide</button>
      <button class="btn-img-toggle show" id="btn-show-images">Show</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════
       CONTRIBUTE
  ═══════════════════════════════════════════════════ -->
  <div class="section-label">About</div>
  <div class="github-row">
    <span>Contribute to SiteEase</span>
    <a href="https://github.com/Aashish17405/SiteEase"
       target="_blank"
       rel="noopener noreferrer">
      <img src="icons/github-logo.svg" alt="GitHub" />
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
